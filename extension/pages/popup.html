<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <title>孩童安心上網管理平台</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: 320px; }
    .status { font-size: 15px; }
    .wrap { padding: 16px; }
    h1 { font-size: 17px; }
    .site { margin: 12px 0; font-size: 14px; word-break: break-all; }
    button { width: 100%; }
  </style>
</head>
<body>
<div class="wrap">
  <h1><img src="../icons/icon32.png" alt="" style="width:24px;height:24px">孩童安心上網管理平台</h1>
  <div class="status mt"><span id="dot" class="dot"></span><span id="status"></span></div>
  <div class="status mt"><span id="dot2" class="dot"></span><span id="status2"></span></div>
  <div class="status mt"><span id="dot3" class="dot"></span><span id="status3"></span></div>
  <p class="site" id="site"></p>
  <button id="settingsBtn" class="primary">家長設定</button>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
